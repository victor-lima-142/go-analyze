apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: finops-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: go_analyze}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: finops-secrets, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: finops-secrets, key: DB_PASSWORD}}}
          readinessProbe: {exec: {command: [pg_isready, -U, go_analyze]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: finops-system}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
