apiVersion: v1
kind: Pod
metadata:
  name: memory-negative
  namespace: finops-test
  labels: {finops-test: "true", finops-role: negative}
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: alexeiled/stress-ng@sha256:91f1313a67e3c8c23f3c75855019d01c4a43e2f872b099f720047f03309d8ad4
      args: ["--vm", "1", "--vm-bytes", "240M", "--vm-keep"]
      resources:
        requests: {memory: "256Mi"}
        limits: {cpu: "500m", memory: "320Mi"}
