apiVersion: v1
kind: Pod
metadata:
  name: cpu-negative
  namespace: finops-test
  labels: {finops-test: "true", finops-role: negative}
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: alexeiled/stress-ng@sha256:91f1313a67e3c8c23f3c75855019d01c4a43e2f872b099f720047f03309d8ad4
      args: ["--cpu", "1", "--cpu-load", "90"]
      resources:
        requests: {cpu: "900m", memory: "8Mi"}
        limits: {cpu: "2000m", memory: "64Mi"}
