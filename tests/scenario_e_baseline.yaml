apiVersion: v1
kind: Pod
metadata:
  name: baseline-ok
  namespace: finops-test
  labels:
    app: baseline-ok
    finops-test: "true"
spec:
  containers:
    - name: stress
      image: alexeiled/stress-ng:latest
      args: ["--cpu", "1", "--cpu-load", "85", "--vm", "1", "--vm-bytes", "230M", "--vm-keep", "--verbose"]
      resources:
        requests:
          cpu: "300m"
          memory: "256Mi"
        limits:
          cpu: "400m"
          memory: "320Mi"
  restartPolicy: Never