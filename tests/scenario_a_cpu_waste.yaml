apiVersion: v1
kind: Namespace
metadata:
  name: finops-test
---
apiVersion: v1
kind: Pod
metadata:
  name: waste-cpu
  namespace: finops-test
  labels:
    app: waste-cpu
    finops-test: "true"
spec:
  containers:
    - name: stress
      image: alexeiled/stress-ng:latest
      args: ["--cpu", "1", "--cpu-load", "30", "--vm", "1", "--vm-bytes", "128M", "--vm-keep", "--verbose"]
      resources:
        requests:
          cpu: "1000m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "640Mi"
  restartPolicy: Never