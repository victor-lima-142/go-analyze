host: localhost:8080
info:
  contact:
    name: Suporte Go-Analyze
  description: Esta é a API do analisador de recursos e custos de workloads Kubernetes
    (go-analyze).
  title: Go Analyze API
  version: "1.0"
paths:
  /api/v1/audit:
    get:
      description: Recalcula os custos de CPU e memória com implementação independente
        e verifica apenas a consistência interna do valor reportado; não valida faturamento
        real.
      parameters:
      - description: 'Período rápido (ex: 1hr, 5d, 10d)'
        in: query
        name: period
        type: string
      - description: Data inicial (RFC3339)
        in: query
        name: start_at
        type: string
      - description: Data final
        in: query
        name: end_at
        type: string
      - description: Inclui ponto-a-ponto
        in: query
        name: details
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuditResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Auditar projeção de custo
      tags:
      - audit
  /api/v1/consolidated:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada das consolidações salvas no banco de
        dados, com filtros de data opcionais e opção de incluir workloads detalhados.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 50, máx: 1000)'
        in: query
        name: pageSize
        type: integer
      - description: Limite alternativo de tamanho de página
        in: query
        name: limit
        type: integer
      - description: 'Se deve incluir itens consolidados de workloads (padrão: true)'
        in: query
        name: include_items
        type: boolean
      - description: 'Período rápido (ex: 1min, 5min, 10min, 30min, 1hr, 5d, 10d)'
        in: query
        name: period
        type: string
      - description: 'Data inicial (ex: RFC3339 ou 2006-01-02)'
        in: query
        name: start_at
        type: string
      - description: Data final
        in: query
        name: end_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedConsolidatedResponse'
        "400":
          description: Parâmetros de filtro ou data inválidos
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Método HTTP não permitido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno ao consultar o banco de dados
          schema:
            additionalProperties: true
            type: object
      summary: Listar consolidações históricas
      tags:
      - consolidated
  /api/v1/experiment/reset:
    post:
      consumes:
      - application/json
      description: Limpa as tabelas de histórico do banco de dados e zera o estado
        interno dos trackers de notificação para uma nova rodada de teste.
      parameters:
      - description: Bearer token experimental
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Resetar dados do experimento
      tags:
      - experiment
  /api/v1/indicators:
    get:
      consumes:
      - application/json
      description: Calcula e retorna os indicadores atuais de otimização de recursos
        a partir do Prometheus.
      parameters:
      - description: 'Janela de tempo para o cálculo (ex: 30s, 1m, 5m, 10m, 30m, 1h)'
        in: query
        name: window
        type: string
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 50, máx: 1000)'
        in: query
        name: pageSize
        type: integer
      - description: Limite alternativo de tamanho de página
        in: query
        name: limit
        type: integer
      - description: Filtrar por Namespace do Kubernetes
        in: query
        name: namespace
        type: string
      - description: Filtrar por Pod do Kubernetes
        in: query
        name: pod
        type: string
      - description: Filtrar por Container do Kubernetes
        in: query
        name: container
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedIndicatorResponse'
        "405":
          description: Método HTTP não permitido
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Falha ao consultar o Prometheus ou calcular indicadores
          schema:
            additionalProperties: true
            type: object
      summary: Obter indicadores calculados atuais
      tags:
      - indicators
  /api/v1/workloads/details:
    get:
      consumes:
      - application/json
      description: Retorna as métricas atuais de execução em tempo real e um histórico
        das consolidações registradas para o workload. O parâmetro `pod` é tratado
        como prefixo (LIKE) quando não contém o caractere %.
      parameters:
      - description: Namespace do Kubernetes
        in: query
        name: namespace
        required: true
        type: string
      - description: Nome do Container no Kubernetes
        in: query
        name: container
        required: true
        type: string
      - description: Prefixo do Pod no Kubernetes (LIKE)
        in: query
        name: pod
        type: string
      - description: Janela de tempo para o cálculo atual
        in: query
        name: window
        type: string
      - description: 'Período rápido para busca histórica (ex: 1hr, 5d, 10d)'
        in: query
        name: period
        type: string
      - description: 'Data inicial para histórico (ex: RFC3339)'
        in: query
        name: start_at
        type: string
      - description: Data final para histórico
        in: query
        name: end_at
        type: string
      - description: 'Número máximo de pontos históricos a retornar (padrão: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkloadDetailsResponse'
        "400":
          description: Namespace e container são parâmetros obrigatórios ou datas
            inválidas
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Método HTTP não permitido
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro ao carregar os dados históricos
          schema:
            additionalProperties: true
            type: object
      summary: Obter detalhes de um workload específico
      tags:
      - workloads
swagger: "2.0"
